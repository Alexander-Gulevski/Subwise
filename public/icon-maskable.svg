<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Отписка">
  <title>Отписка</title>

  <!--
    Maskable-вариант: фон на всю площадь, глиф уменьшен и центрирован
    внутри безопасной зоны (80% площади), чтобы Android не обрезал его
    при наложении своей маски.
  -->
  <rect width="512" height="512" fill="#2563EB"/>

  <g transform="translate(256 256) scale(0.62) translate(-256 -256)">
    <g fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round">
      <path d="M 352 176
               A 128 128 0 1 1 256 128"/>
    </g>
    <path d="M 250 96 L 300 128 L 250 160 Z" fill="#FFFFFF"/>
    <g stroke="#2563EB" stroke-width="30" stroke-linecap="round">
      <path d="M 330 190 L 396 124"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="14" stroke-linecap="round">
      <path d="M 330 190 L 396 124"/>
    </g>
  </g>
</svg>
